<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rushi Gardens - Fresh Produce Order</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌿 Rushi Gardens</h1>
    <p>Fresh Farm Produce — Order by the Pound</p>
  </header>

  <main>
    <h2>Available Produce</h2>
    <form id="orderForm">
      <div id="productList"></div>

      <div class="summary">
        <h3>Total Estimated Price: $<span id="totalPrice">0.00</span></h3>
      </div>

      <h3>Customer Details</h3>
      <label>Name: <input type="text" id="custName" required></label>
      <label>Phone/Email: <input type="text" id="custContact" required></label>

      <button type="submit">Place Order</button>
    </form>
  </main>

  <script src="products.js"></script>
  <script>
    const inventory = getInventory().filter(p => p.inStock);
    const container = document.getElementById('productList');

    function renderStore() {
      container.innerHTML = '';
      inventory.forEach(p => {
        const item = document.createElement('div');
        item.className = 'product-item';
        item.innerHTML = `
          <label>
            <strong>${p.name}</strong> ($${p.pricePerLb.toFixed(2)} / lb)
          </label>
          <input type="number" min="0" step="0.5" value="0" 
                 data-price="${p.pricePerLb}" data-name="${p.name}" class="qty-input"> lbs
        `;
        container.appendChild(item);
      });

      document.querySelectorAll('.qty-input').forEach(input => {
        input.addEventListener('input', calculateTotal);
      });
    }

    function calculateTotal() {
      let total = 0;
      document.querySelectorAll('.qty-input').forEach(input => {
        const lbs = parseFloat(input.value) || 0;
        const price = parseFloat(input.getAttribute('data-price'));
        total += lbs * price;
      });
      document.getElementById('totalPrice').innerText = total.toFixed(2);
    }

    document.getElementById('orderForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('custName').value;
      const contact = document.getElementById('custContact').value;
      let orderSummary = `Order from ${name} (${contact}):\n`;

      document.querySelectorAll('.qty-input').forEach(input => {
        const lbs = parseFloat(input.value) || 0;
        if (lbs > 0) {
          orderSummary += `- ${input.getAttribute('data-name')}: ${lbs} lbs\n`;
        }
      });

      orderSummary += `Total: $${document.getElementById('totalPrice').innerText}`;
      
      // Opens user's default email client pre-filled with order details
      const mailtoUrl = `mailto:your-email@example.com?subject=New Order - ${encodeURIComponent(name)}&body=${encodeURIComponent(orderSummary)}`;
      window.location.href = mailtoUrl;
    });

    renderStore();
  </script>
</body>
</html>
