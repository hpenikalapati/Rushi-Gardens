<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rushi Gardens - Order Produce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌿 Rushi Gardens</h1>
    <p>Fresh Produce — Ordered by the Pound</p>
  </header>

  <main>
    <h2>Available Produce</h2>
    <form id="orderForm">
      <div id="productList">Loading available items...</div>

      <div class="summary">
        <h3>Total: $<span id="totalPrice">0.00</span></h3>
      </div>

      <h3>Customer Details</h3>
      <label>Name: <input type="text" id="custName" name="Customer Name" required></label>
      <label>Phone: <input type="tel" id="custPhone" name="Customer Phone" required></label>
      <label>Email: <input type="email" id="custEmail" name="Customer Email" required></label>

      <button type="submit" id="submitBtn">Submit & Send Order</button>
    </form>
  </main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <script>
    // Config: Paste your Firebase details here
    const firebaseConfig = {
      apiKey: "AIzaSyCzHvC09ahmaO2Btw7ofjyu4hhK2jh5sVI",
      authDomain: "rushi-gardens.firebaseapp.com",
      databaseURL: "https://rushi-gardens-default-rtdb.firebaseio.com",
      projectId: "rushi-gardens",
      storageBucket: "rushi-gardens.firebasestorage.app",
      messagingSenderId: "346604079812",
      appId: "1:346604079812:web:da377ab1e04d03f259d791",
      measurementId: "G-KZ7YDLDT2J"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const formspreeEndpoint = "https://formspree.io/f/xdaqygyw";

    const container = document.getElementById('productList');

    // Load available produce live from Firestore
    db.collection('products').where('inStock', '==', true).orderBy('name', 'asc').onSnapshot(snapshot => {
      container.innerHTML = '';
      if (snapshot.empty) {
        container.innerHTML = '<p>No items in stock today. Please check back later!</p>';
        return;
      }

      snapshot.forEach(doc => {
        const p = doc.data();
        const item = document.createElement('div');
        item.className = 'product-item';
        item.innerHTML = `
          <label>
            <strong>${p.name}</strong> ($${parseFloat(p.pricePerLb).toFixed(2)} / lb)
          </label>
          <input type="number" min="0" step="0.5" value="0" 
                 data-id="${doc.id}" data-name="${p.name}" data-price="${p.pricePerLb}" class="qty-input"> lbs
        `;
        container.appendChild(item);
      });

      document.querySelectorAll('.qty-input').forEach(input => {
        input.addEventListener('input', calculateTotal);
      });
    });

    function calculateTotal() {
      let total = 0;
      document.querySelectorAll('.qty-input').forEach(input => {
        const lbs = parseFloat(input.value) || 0;
        const price = parseFloat(input.getAttribute('data-price'));
        total += lbs * price;
      });
      document.getElementById('totalPrice').innerText = total.toFixed(2);
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Processing Order...';

      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const email = document.getElementById('custEmail').value;
      const total = document.getElementById('totalPrice').innerText;

      let itemsOrdered = [];
      let itemsSummaryString = '';

      document.querySelectorAll('.qty-input').forEach(input => {
        const lbs = parseFloat(input.value) || 0;
        if (lbs > 0) {
          const itemName = input.getAttribute('data-name');
          const unitPrice = parseFloat(input.getAttribute('data-price'));
          const subtotal = lbs * unitPrice;

          itemsOrdered.push({ name: itemName, lbs: lbs, pricePerLb: unitPrice, subtotal: subtotal });
          itemsSummaryString += `${itemName}: ${lbs} lbs ($${subtotal.toFixed(2)})\n`;
        }
      });

      if (itemsOrdered.length === 0) {
        alert('Please select at least one produce item.');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit & Send Order';
        return;
      }

      const orderData = {
        customerName: name,
        customerPhone: phone,
        customerEmail: email,
        items: itemsOrdered,
        totalAmount: parseFloat(total),
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        status: 'Pending'
      };

      try {
        // 1. Save to Firebase Database for Admin Panel
        await db.collection('orders').add(orderData);

        // 2. Post receipt directly to Formspree (Sends email to rushigardens@gmail.com)
        await fetch(formspreeEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            _subject: `New Produce Order from ${name}`,
            "Customer Name": name,
            "Customer Phone": phone,
            "Customer Email": email,
            "Order Details": itemsSummaryString,
            "Total Amount": `$${total}`
          })
        });

        alert('Thank you! Your order has been submitted and a receipt was sent to Rushi Gardens.');
        window.location.reload();
      } catch (err) {
        console.error("Order submission failed:", err);
        alert('An error occurred submitting your order. Please try again.');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit & Send Order';
      }
    });
  </script>
</body>
</html>
