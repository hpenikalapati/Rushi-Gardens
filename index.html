<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rushi Gardens - Order Produce</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Customer Form Clean Layout */
    .customer-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 400px;
      margin-top: 10px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {
      font-weight: bold;
      font-size: 0.9em;
    }
    .form-group input {
      padding: 8px;
      font-size: 1em;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌿 Rushi Gardens</h1>
    <p>Fresh Produce — Order by the Pound or Piece</p>
  </header>

  <main>
    <h2>Available Produce</h2>
    <form id="orderForm">
      <div id="productList">Loading available items...</div>

      <div class="summary">
        <h3>Total: $<span id="totalPrice">0.00</span></h3>
      </div>

      <h3>Customer Details</h3>
      <div class="customer-form">
        <div class="form-group">
          <label for="custName">Name:</label>
          <input type="text" id="custName" name="Customer Name" placeholder="Your Full Name" required>
        </div>
        
        <div class="form-group">
          <label for="custPhone">Phone Number:</label>
          <input type="tel" id="custPhone" name="Customer Phone" placeholder="(123) 456-7890" required>
        </div>

        <div class="form-group">
          <label for="custEmail">Email Address:</label>
          <input type="email" id="custEmail" name="Customer Email" placeholder="you@example.com" required>
        </div>
      </div>

      <br>
      <button type="submit" id="submitBtn">Submit & Send Order</button>
    </form>
  </main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCzHvC09ahmaO2Btw7ofjyu4hhK2jh5sVI",
      authDomain: "rushi-gardens.firebaseapp.com",
      databaseURL: "https://rushi-gardens-default-rtdb.firebaseio.com",
      projectId: "rushi-gardens",
      storageBucket: "rushi-gardens.firebasestorage.app",
      messagingSenderId: "346604079812",
      appId: "1:346604079812:web:da377ab1e04d03f259d791",
      measurementId: "G-KZ7YDLDT2J"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const formspreeEndpoint = "https://formspree.io/f/xdaqygyw";
    const container = document.getElementById('productList');

    // Helper function to detect unit label and input step
    function getItemUnitConfig(itemName) {
      const lower = itemName.toLowerCase();
      if (lower.includes('paan')) {
        return { label: 'leaf', step: '1', displayPrice: '/ leaf' };
      }
      return { label: 'lbs', step: '0.5', displayPrice: '/ lb' };
    }

    db.collection('products').onSnapshot(snapshot => {
      container.innerHTML = '';

      if (snapshot.empty) {
        container.innerHTML = '<p>No items found in database.</p>';
        return;
      }

      const availableProducts = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        if (data.inStock === true || data.inStock === "true") {
          availableProducts.push({ id: doc.id, ...data });
        }
      });

      if (availableProducts.length === 0) {
        container.innerHTML = '<p>No items in stock today. Please check back later!</p>';
        return;
      }

      // Sort alphabetically A-Z
      availableProducts.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

      // Render items
      availableProducts.forEach(p => {
        const item = document.createElement('div');
        item.className = 'product-item';
        const price = parseFloat(p.pricePerLb) || 0;
        const unitConfig = getItemUnitConfig(p.name);

        item.innerHTML = `
          <label>
            <strong>${p.name}</strong> ($${price.toFixed(2)} ${unitConfig.displayPrice})
          </label>
          <span>
            <input type="number" min="0" step="${unitConfig.step}" value="0" 
                   data-id="${p.id}" data-name="${p.name}" data-price="${price}" data-unit="${unitConfig.label}" class="qty-input"> ${unitConfig.label}
          </span>
        `;
        container.appendChild(item);
      });

      document.querySelectorAll('.qty-input').forEach(input => {
        input.addEventListener('input', calculateTotal);
      });

    }, error => {
      console.error("Firestore Error:", error);
      container.innerHTML = `<p style="color: red;">Error loading products: ${error.message}</p>`;
    });

    function calculateTotal() {
      let total = 0;
      document.querySelectorAll('.qty-input').forEach(input => {
        const qty = parseFloat(input.value) || 0;
        const price = parseFloat(input.getAttribute('data-price'));
        total += qty * price;
      });
      document.getElementById('totalPrice').innerText = total.toFixed(2);
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Processing Order...';

      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const email = document.getElementById('custEmail').value;
      const total = document.getElementById('totalPrice').innerText;

      let itemsOrdered = [];
      let itemsSummaryString = '';

      document.querySelectorAll('.qty-input').forEach(input => {
        const qty = parseFloat(input.value) || 0;
        if (qty > 0) {
          const itemName = input.getAttribute('data-name');
          const unitPrice = parseFloat(input.getAttribute('data-price'));
          const unitLabel = input.getAttribute('data-unit');
          const subtotal = qty * unitPrice;

          itemsOrdered.push({ name: itemName, qty: qty, unit: unitLabel, pricePerUnit: unitPrice, subtotal: subtotal });
          itemsSummaryString += `${itemName}: ${qty} ${unitLabel} ($${subtotal.toFixed(2)})\n`;
        }
      });

      if (itemsOrdered.length === 0) {
        alert('Please select at least one produce item.');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit & Send Order';
        return;
      }

      const orderData = {
        customerName: name,
        customerPhone: phone,
        customerEmail: email,
        items: itemsOrdered,
        totalAmount: parseFloat(total),
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        status: 'Pending'
      };

      try {
        await db.collection('orders').add(orderData);

        await fetch(formspreeEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            _subject: `New Produce Order from ${name}`,
            "Customer Name": name,
            "Customer Phone": phone,
            "Customer Email": email,
            "Order Details": itemsSummaryString,
            "Total Amount": `$${total}`
          })
        });

        alert('Thank you! Your order has been submitted and a receipt was sent to Rushi Gardens.');
        window.location.reload();
      } catch (err) {
        console.error("Order submission failed:", err);
        alert('An error occurred submitting your order. Please try again.');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit & Send Order';
      }
    });
  </script>
</body>
</html>
